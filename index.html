<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fde3c8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brudoku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Brudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.4,0,.2,1)}
body[data-theme="claro"]{
  --bg:radial-gradient(120% 80% at 50% -10%,#fff1dc 0%,#fde3c8 45%,#f7d2b8 100%);
  --ink:#4a3328;--muted:#a07f6a;--card:#fffaf3;--cardBorder:transparent;
  --shadow:0 4px 0 #ecd2b6,0 12px 28px rgba(160,90,40,.14);--soft-shadow:0 3px 0 #ecd2b6;
  --accent:#ff7a59;--accentShadow:#d4573a;--accent2:#7b4bd6;--accent2Shadow:#5a32a8;--line:#4a3328;
  --chip:#fff2e2;--chipInk:#8a6a55;--pill:#ffe6cf;--x:#4a3328;--overlay:rgba(60,35,20,.55);
}
body[data-theme="escuro"]{
  --bg:radial-gradient(120% 70% at 50% 0%,#33285e 0%,#1b1736 55%,#110e24 100%);
  --ink:#f3ecff;--muted:#a59cc9;--card:#251f45;--cardBorder:rgba(255,255,255,.08);
  --shadow:0 4px 0 #120e27,0 12px 28px rgba(0,0,0,.35);--soft-shadow:0 3px 0 #120e27;
  --accent:#ff7a8f;--accentShadow:#c24a60;--accent2:#9b7bff;--accent2Shadow:#6a4fd0;--line:#120e27;
  --chip:#2d2652;--chipInk:#c8bff0;--pill:#352d63;--x:#1b1530;--overlay:rgba(8,6,20,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;transition:color .5s var(--soft)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
svg.bru{display:block;width:100%;height:100%;overflow:visible}

/* ---------- views ---------- */
.view{position:fixed;inset:0;display:flex;justify-content:center;overflow-y:auto;overflow-x:hidden;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
  opacity:0;visibility:hidden;transform:translateX(30px);transition:opacity .4s var(--soft),transform .5s var(--ease),visibility 0s .4s}
.view.show{opacity:1;visibility:visible;transform:none;transition:opacity .4s var(--soft),transform .5s var(--ease)}
.view.left{transform:translateX(-30px)}
.inner{width:100%;max-width:470px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1.5px solid var(--cardBorder);box-shadow:var(--shadow);border-radius:20px;transition:background-color .5s,box-shadow .5s}

/* ---------- home ---------- */
#home .inner{min-height:100%;justify-content:center;gap:14px}
.hero{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}
.heroFace{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center}
.heroFace .rays{position:absolute;inset:-30px;border-radius:50%;opacity:.55;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,90,.55) 0 10deg,transparent 10deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:spin 24s linear infinite}
.heroFace .face{width:150px;height:150px;animation:heroBob 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
@keyframes heroBob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.title{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1;margin:2px 0 0;color:var(--accent2)}
.title span{color:var(--accent)}
.tag{color:var(--muted);font-weight:600;margin-top:2px}
.bigbtn{width:100%;padding:16px;border-radius:20px;font-size:22px;font-weight:800;background:var(--accent);color:#fff;
  box-shadow:0 5px 0 var(--accentShadow),0 12px 24px rgba(255,122,89,.3);display:flex;flex-direction:column;align-items:center;line-height:1.1;
  transition:transform .2s var(--spring)}
.bigbtn small{font-size:14px;font-weight:600;opacity:.9}
.bigbtn:active{transform:translateY(3px) scale(.98);box-shadow:0 2px 0 var(--accentShadow)}
.modeBtn{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;transition:transform .2s var(--spring)}
.modeBtn:active{transform:scale(.97)}
.modeBtn .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.modeBtn b{display:block;font-size:18px;line-height:1.1}
.modeBtn small{color:var(--muted);font-weight:600;font-size:13.5px}
.modeBtn .go{margin-left:auto;font-size:20px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.smallBtn{padding:12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .2s var(--spring)}
.smallBtn:active{transform:scale(.95)}
.flame{display:inline-block;animation:flame 1.4s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}

/* ---------- game ---------- */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.iconBtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--soft-shadow);font-size:20px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--cardBorder);transition:transform .2s var(--spring)}
.iconBtn:active{transform:scale(.9)}
.gtitle{text-align:center;font-size:24px;font-weight:800}
.gtitle small{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:-4px}
.status{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 14px}
.stat small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.stat b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.mid{text-align:center}.stat.right{text-align:right}
.found{display:flex;align-items:center;gap:6px}
.found .av{width:34px;height:34px;transition:transform .3s var(--spring)}
.found .av.react{animation:react .5s var(--spring)}
@keyframes react{40%{transform:scale(1.3) rotate(-10deg)}}
.found .av.shiver{animation:shiver .5s}
@keyframes shiver{20%,60%{transform:translateX(-3px) rotate(-6deg)}40%,80%{transform:translateX(3px) rotate(6deg)}}
.hearts{font-size:19px;letter-spacing:1px}
.hearts span{display:inline-block;transition:filter .5s,opacity .5s,transform .5s var(--spring)}
.hearts span.lost{filter:grayscale(1);opacity:.28;transform:scale(.82)}
.hearts span:not(.lost){animation:beat 2.4s ease-in-out infinite}
.hearts span:nth-child(2){animation-delay:.15s}.hearts span:nth-child(3){animation-delay:.3s}
@keyframes beat{0%,70%,100%{transform:scale(1)}78%{transform:scale(1.14)}86%{transform:scale(.98)}92%{transform:scale(1.06)}}
.hearts span.breaking{animation:heartBreak .6s var(--ease)}
@keyframes heartBreak{30%{transform:scale(1.35) rotate(-8deg)}60%{transform:scale(.7) rotate(6deg)}100%{transform:scale(.82)}}
.zen .stat.mid{visibility:hidden}
.rules{display:flex;gap:6px}
.rules div{flex:1;font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;border-radius:10px;padding:6px 4px;background:var(--chip);color:var(--chipInk);border:1.5px solid var(--cardBorder)}
.boardwrap{padding:9px}
.board{display:grid;width:100%;aspect-ratio:1;border:3px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;position:relative;transition:border-color .5s}
.cell{position:relative;min-width:0;min-height:0;overflow:hidden;border:.5px solid rgba(0,0,0,.10);cursor:pointer;transition:background-color .55s var(--soft),filter .3s}
.cell.bt{border-top:2.5px solid var(--line)}.cell.bb{border-bottom:2.5px solid var(--line)}.cell.bl{border-left:2.5px solid var(--line)}.cell.br{border-right:2.5px solid var(--line)}
.cell.enter{animation:cellIn .5s var(--ease) both;animation-delay:var(--in,0ms)}
@keyframes cellIn{from{opacity:0;transform:scale(.6)}}
.cell::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
.cell.press::after{opacity:.28;transition:opacity 0s}
.cell .x,.cell .bw{position:absolute;left:50%;top:50%;translate:-50% -50%}
.cell .x{width:42%;height:42%;overflow:visible}
.cell .x path{stroke-dasharray:9;stroke-dashoffset:9;animation:draw .22s var(--ease) forwards}
.cell .x path+path{animation-delay:.07s}
.cell .x.delay path{animation-delay:var(--d,0ms)}.cell .x.delay path+path{animation-delay:calc(var(--d,0ms) + 70ms)}
.cell .x.static path{animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.cell.auto .x{opacity:.32}
.cell .x.out{animation:xout .2s var(--soft) forwards}
@keyframes xout{to{opacity:0;transform:scale(.6)}}
.cell.wrong{background-image:repeating-linear-gradient(45deg,rgba(229,72,77,.32) 0 5px,transparent 5px 10px)!important}
.cell.err{animation:nudge .42s var(--soft)}
@keyframes nudge{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.bw{width:92%;height:92%;animation:breathe 3.6s ease-in-out infinite;animation-delay:var(--o,0s)}
.bw .bru{animation:land .55s var(--spring) both;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.28))}
.bw.static .bru{animation:none}
@keyframes land{0%{transform:translateY(-40%) scale(.3);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3%) scale(1.03)}}
.bw.cheer{animation:cheer .6s var(--spring) both;animation-delay:var(--c,0ms)}
@keyframes cheer{40%{transform:translateY(-22%) scale(1.15) rotate(-8deg)}70%{transform:translateY(0) scale(.96) rotate(4deg)}}
.ripple{position:absolute;left:50%;top:50%;width:90%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%) scale(.3);opacity:.9;pointer-events:none;animation:ripple .75s var(--ease) forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
.cell.flash{animation:flash .7s var(--soft) both;animation-delay:var(--d,0ms)}
@keyframes flash{40%{filter:brightness(1.18) saturate(1.15)}}
.cell.wave{animation:wave .9s var(--soft) both;animation-delay:var(--d,0ms)}
@keyframes wave{35%{filter:brightness(1.25) saturate(1.2);transform:scale(.93)}}
.cell.hint{animation:hintGlow 1.2s var(--soft)}
@keyframes hintGlow{30%,70%{filter:brightness(1.3) saturate(1.2)}}
.shake{animation:boardShake .4s var(--soft)}
@keyframes boardShake{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--card);border:1.5px solid var(--cardBorder);box-shadow:var(--soft-shadow);border-radius:16px;padding:10px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--spring),opacity .3s}
.tool b{font-size:20px}
.tool:active{transform:scale(.95)}
.tool:disabled{opacity:.45}
.help{font-size:12.5px;color:var(--muted);text-align:center;margin:0;font-weight:600}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;color:var(--muted);background:var(--card)}
.loading svg{width:60px;height:60px;animation:hop .6s var(--soft) infinite alternate}
@keyframes hop{from{transform:translateY(4px) scaleY(.94)}to{transform:translateY(-10px)}}
.bump{display:inline-block;animation:bump .45s var(--spring)}
@keyframes bump{40%{transform:scale(1.28)}}

/* ---------- sheets (stats, settings) ---------- */
.sheetWrap{position:fixed;inset:0;z-index:30;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.sheetWrap.show{opacity:1;visibility:visible;transition:opacity .35s}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .5s var(--ease)}
.sheetWrap.show .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--muted);opacity:.4;margin:2px auto 10px}
.sheet h2{margin:0 0 12px;font-size:26px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{background:var(--chip);width:36px;height:36px;border-radius:12px;font-size:18px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.statBox{background:var(--chip);border-radius:16px;padding:12px;text-align:center}
.statBox b{display:block;font-size:30px;line-height:1.1}
.statBox small{color:var(--muted);font-weight:700;font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;font-weight:600}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--chip)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sec{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 6px}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--chip)}
.setRow div b{display:block;font-size:17px}
.setRow div small{color:var(--muted);font-weight:600}
.switch{width:52px;height:30px;border-radius:99px;background:var(--chip);position:relative;flex:none;transition:background .3s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .35s var(--spring)}
.switch.on{background:var(--accent2)}
.switch.on::after{transform:translateX(22px)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{padding:7px 12px;border-radius:9px;font-weight:700;font-size:14px;background:transparent;color:var(--chipInk);transition:background .3s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.danger{width:100%;margin-top:16px;padding:12px;border-radius:14px;background:transparent;border:1.5px solid #e5484d;color:#e5484d;font-weight:700;font-size:15px}

/* ---------- win / lose ---------- */
.fx{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;
  background:var(--overlay);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
.fx.show{opacity:1;visibility:visible;transition:opacity .45s}
.fx h1{margin:0;font-size:46px;font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 30px rgba(255,200,90,.6);transform:scale(.3);opacity:0}
.fx.show h1{animation:titleIn .7s var(--spring) .15s forwards}
@keyframes titleIn{to{transform:none;opacity:1}}
.stage{position:relative;width:250px;height:250px;display:flex;align-items:center;justify-content:center}
.stage .rays{position:absolute;inset:-60px;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,102,.75) 0 9deg,transparent 9deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%)}
.fx.show .stage .rays{animation:raysIn .8s var(--soft) .25s forwards,spin 14s linear infinite}
@keyframes raysIn{to{opacity:1}}
.stage .glow{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.95),rgba(255,200,90,0) 70%)}
.stage .face{position:relative;width:190px;height:190px;transform:scale(0) rotate(-30deg)}
.fx.show .stage .face{animation:faceIn .8s var(--spring) .3s forwards,faceDance 1.6s ease-in-out 1.1s infinite}
@keyframes faceIn{to{transform:none}}
@keyframes faceDance{0%,100%{transform:rotate(-6deg) translateY(0)}25%{transform:rotate(0) translateY(-10px)}50%{transform:rotate(6deg) translateY(0)}75%{transform:rotate(0) translateY(-6px)}}
.spark{position:absolute;font-size:20px;opacity:0}
.fx.show .spark{animation:sparkle 1.8s ease-in-out infinite;animation-delay:var(--sd)}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
.phrase{max-width:340px;font-size:23px;font-weight:800;color:#fff;line-height:1.25;min-height:58px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.phrase span{display:inline-block;opacity:0;transform:translateY(12px) scale(.8)}
.phrase span.in{animation:wordIn .5s var(--spring) forwards}
@keyframes wordIn{to{opacity:1;transform:none}}
.fxInfo{color:#fff;opacity:0;font-weight:700;font-size:16px;transition:opacity .5s}
.fxInfo.in{opacity:.9}
.fxInfo .stars span{display:inline-block;font-size:26px;transform:scale(0)}
.fxInfo.in .stars span{animation:starIn .5s var(--spring) forwards}
@keyframes starIn{to{transform:none}}
.fxBtns{width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px;margin-top:6px;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .6s var(--spring)}
.fxBtns.in{opacity:1;transform:none}
.fxBtns .bigbtn{font-size:21px}
.ghost{padding:12px;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:16px}
.confetti{position:fixed;top:-16px;width:8px;height:12px;border-radius:2px;z-index:41;pointer-events:none;
  animation:fall var(--t,2.6s) cubic-bezier(.25,.6,.4,1) forwards;animation-delay:var(--dl,0s)}
@keyframes fall{to{transform:translate(var(--sx,0px),105vh) rotate(var(--r,540deg))}}
.fx.lose .face{animation:none!important;transform:none}
.fx.lose.show .face{animation:loseIn .6s var(--spring) .2s both,shiver 1.2s ease-in-out .9s infinite!important}
@keyframes loseIn{from{transform:scale(0)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
// ===== Brudoku generator: n×n, k Brunos per row/col/region, no touching =====
let rng=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=n=>Math.floor(rng()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

// row options: sorted column sets of size k, non-adjacent within row
function rowOptions(n,k){const out=[];(function rec(start,acc){if(acc.length===k){out.push(acc.slice());return}
  for(let c=start;c<n;c++){if(acc.length&&c-acc[acc.length-1]<2)continue;acc.push(c);rec(c+1,acc);acc.pop()}})(0,[]);return out}

// generic solver: returns count up to limit; if want!=null, finds a solution different from `avoid`; tracks nodes
function solve(n,k,reg,{limit=2,randomize=false,avoid=null}={}){
  const opts=rowOptions(n,k);
  const colCnt=new Array(n).fill(0),regCnt=new Array(n).fill(0);
  // remaining cells per region in rows >= r (for pruning)
  const regRowCells=[];for(let r=0;r<=n;r++)regRowCells.push(new Array(n).fill(0));
  for(let r=n-1;r>=0;r--){for(let g=0;g<n;g++)regRowCells[r][g]=regRowCells[r+1][g];for(let c=0;c<n;c++)regRowCells[r][reg[r*n+c]]++}
  const rows=[];let count=0,nodes=0,found=null;
  function rec(r,prev){
    if(count>=limit)return;nodes++;
    if(nodes>4e6)return;
    if(r===n){if(avoid){let diff=false;for(let i=0;i<n&&!diff;i++)if(rows[i].join()!==avoid[i].join())diff=true;if(!diff)return;found=rows.map(x=>x.slice())}
      else if(!found)found=rows.map(x=>x.slice());count++;return}
    const left=n-r; // rows remaining including r
    // column feasibility: need k-colCnt <= ceil(left/2)
    for(let c=0;c<n;c++){if(k-colCnt[c]>Math.ceil(left/2))return}
    for(let g=0;g<n;g++){if(k-regCnt[g]>regRowCells[r][g])return}
    const list=randomize?shuffle(opts.slice()):opts;
    for(const o of list){
      let ok=true;
      for(const c of o){if(colCnt[c]>=k){ok=false;break}if(prev){for(const p of prev)if(Math.abs(p-c)<=1){ok=false;break}}if(!ok)break}
      if(!ok)continue;
      // region counts
      const gs=o.map(c=>reg[r*n+c]);
      const tmp={};for(const g of gs){tmp[g]=(tmp[g]||0)+1;if(regCnt[g]+tmp[g]>k){ok=false;break}}
      if(!ok)continue;
      for(const c of o)colCnt[c]++;for(const g of gs)regCnt[g]++;rows.push(o);
      rec(r+1,o);
      rows.pop();for(const c of o)colCnt[c]--;for(const g of gs)regCnt[g]--;
      if(count>=limit)return;
    }
  }
  rec(0,null);
  return{count,nodes,found};
}

function genSolution(n,k){
  const r=solve(n,k,new Array(n*n).fill(0).map((_,i)=>i%n),{limit:1,randomize:true}); // dummy regions: col-based (each col region gets k) - always satisfiable
  return r.found;
}

function growRegions(n,k,sol){
  const reg=new Array(n*n).fill(-1);
  const stars=[];sol.forEach((cols,r)=>cols.forEach(c=>stars.push(r*n+c)));
  const cells=[];
  if(k===1){stars.forEach((s,g)=>{reg[s]=g;cells.push([s])})}
  else{
    // pair stars greedily by distance, connect each pair with a path
    const un=shuffle(stars.slice());let g=0;
    while(un.length){const a=un.pop();let bi=-1,bd=1e9;
      un.forEach((b,i)=>{const d=Math.abs(((a/n)|0)-((b/n)|0))+Math.abs(a%n-b%n);if(d<bd){bd=d;bi=i}});
      const b=un.splice(bi,1)[0];
      // BFS path a->b through unassigned non-star cells
      const prev=new Map([[a,-1]]),q=[a];let ok=false;
      while(q.length){const x=q.shift();if(x===b){ok=true;break}const r=(x/n)|0,c=x%n;
        for(const [dr,dc] of shuffle([[1,0],[-1,0],[0,1],[0,-1]])){const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=n||nc>=n)continue;const y=nr*n+nc;
          if(prev.has(y))continue;if(reg[y]!==-1)continue;if(y!==b&&stars.includes(y))continue;prev.set(y,x);q.push(y)}}
      if(!ok)return null;
      const list=[];let x=b;while(x!==-1){reg[x]=g;list.push(x);x=prev.get(x)}
      cells.push(list);g++;
    }
  }
  const w=cells.map(()=>0.25+rng()*rng()*3);let tw=w.reduce((a,b)=>a+b,0);
  let left=reg.filter(v=>v===-1).length,guard=0;
  while(left>0&&guard++<200000){let t=rng()*tw,g=0;while(t>w[g]&&g<n-1){t-=w[g];g++}
    const list=cells[g],ci=list[rnd(list.length)],r=(ci/n)|0,c=ci%n,d=[[1,0],[-1,0],[0,1],[0,-1]][rnd(4)],nr=r+d[0],nc=c+d[1];
    if(nr<0||nc<0||nr>=n||nc>=n)continue;const ni=nr*n+nc;if(reg[ni]!==-1)continue;reg[ni]=g;list.push(ni);left--}
  return left>0?null:reg;
}

function connectedWithout(n,reg,g,skip){const cells=[];for(let i=0;i<n*n;i++)if(reg[i]===g&&i!==skip)cells.push(i);if(!cells.length)return false;
  const seen=new Set([cells[0]]),st=[cells[0]];while(st.length){const i=st.pop(),r=(i/n)|0,c=i%n;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=n||nc>=n)continue;const j=nr*n+nc;if(j!==skip&&reg[j]===g&&!seen.has(j)){seen.add(j);st.push(j)}}}
  return seen.size===cells.length}

function refine(n,k,reg,sol,steps){
  const isSol=new Set();sol.forEach((cols,r)=>cols.forEach(c=>isSol.add(r*n+c)));
  for(let s=0;s<steps;s++){
    const alt=solve(n,k,reg,{limit:1,randomize:true,avoid:sol}).found;
    if(!alt)return true;
    const cand=[];alt.forEach((cols,r)=>cols.forEach(c=>{const i=r*n+c;if(!isSol.has(i))cand.push(i)}));shuffle(cand);
    let moved=false;
    for(const i of cand){const r=(i/n)|0,c=i%n,g=reg[i];if(!connectedWithout(n,reg,g,i))continue;
      const nb=shuffle([[1,0],[-1,0],[0,1],[0,-1]].map(([dr,dc])=>[r+dr,c+dc]).filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n).map(([a,b])=>reg[a*n+b]).filter(x=>x!==g));
      if(!nb.length)continue;reg[i]=nb[0];moved=true;break}
    if(!moved)return false;
  }
  return solve(n,k,reg,{limit:2}).count===1;
}

function generateOne(n,k,deadline){
  while(Date.now()<deadline){
    const sol=genSolution(n,k);const reg=growRegions(n,k,sol);if(!reg)continue;
    if(refine(n,k,reg,sol,n*k*6))return{n,k,sol,reg};
  }
  return null;
}
// difficulty score: nodes needed by plain solver (higher = more deduction needed)
function generate(n,k,{seed=null,budgetMs=700,candidates=4}={}){
  rng=seed==null?Math.random:mulberry32(seed);
  const t0=Date.now();let best=null;
  for(let i=0;i<candidates;i++){
    const p=generateOne(n,k,t0+Math.max(budgetMs,4000));if(!p)break;
    p.score=solve(n,k,p.reg,{limit:2}).nodes;
    if(!best||p.score>best.score)best=p;
    if(seed==null&&Date.now()-t0>budgetMs)break;
  }
  rng=Math.random;
  return best;
}

                 escuro:["#e98aa3","#e9bf5c","#6dbbe8","#a593ec","#8fc95a","#eb9a5c","#5cc7b4","#ea7c7c","#cb8ddb","#97a6c4"]};

               set(k,v){try{localStorage.setItem('brudoku3_'+k,JSON.stringify(v))}catch(e){}}};
  const oldLevel=(()=>{try{return JSON.parse(localStorage.getItem('brudoku_level')||'1')}catch(e){return 1}})();

  let stats=Object.assign({played:0,won:0,lost:0,best:{},hardWon:0,dailyDone:0,streak:0,bestStreak:0,lastDaily:null,brunos:0},store.get('stats',{}));
  const save=()=>{store.set('settings',settings);store.set('progress',progress);store.set('stats',stats)};

  const $=id=>document.getElementById(id);
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const fmt=s=>`${(s/60)|0}:${String(s%60).padStart(2,'0')}`;
  const restart=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};

  // ================= sound =================
  let AC=null;
  function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
  function tone(f,t0,d,type='sine',vol=.18,slide=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;
    o.frequency.setValueAtTime(f,a.currentTime+t0);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,a.currentTime+t0+d);
    g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);
    o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.02)}
  const AUD={};for(const k in VOICE)if(VOICE[k]){try{const a=new Audio(VOICE[k]);a.preload='auto';AUD[k]=a}catch(e){}}
  let curVoice=null,unlocked=false;
  function unlockAudio(){if(unlocked)return;unlocked=true;ac();for(const k in AUD){const a=AUD[k];try{a.muted=true;const p=a.play();if(p)p.then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false})}catch(e){a.muted=false}}}
  document.addEventListener('pointerdown',unlockAudio,{once:true,capture:true});
  function voice(key){if(!settings.sound||!AUD[key])return false;try{if(curVoice&&curVoice!==AUD[key]){curVoice.pause()}const a=AUD[key];a.muted=false;a.currentTime=0;a.play().catch(()=>{});curVoice=a}catch(e){return false}return true}
  const SFX={
    tap:()=>tone(880,0,.05,'triangle',.06),
    mark:()=>tone(520,0,.06,'triangle',.07,.8),
    good:()=>{tone(660,0,.12,'sine',.16);tone(990,.08,.18,'sine',.14);tone(1320,.16,.22,'sine',.1)},
    bad:()=>{tone(300,0,.32,'square',.08,.45);tone(220,.05,.3,'sine',.12,.5)},
    hint:()=>{tone(1200,0,.1,'sine',.1);tone(1500,.07,.14,'sine',.08)},
    win:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.35,'triangle',.14));tone(1568,.6,.6,'sine',.1)},
    lose:()=>{[440,370,311,262].forEach((f,i)=>tone(f,i*.16,.3,'triangle',.12))},
    pop:()=>tone(700,0,.07,'sine',.08,1.6)
  };
  function sfx(name,voiceKey){if(!settings.sound)return;if(voiceKey&&voice(voiceKey))return;try{SFX[name]()}catch(e){}}

  // ================= theme =================
  function applyTheme(){document.body.dataset.theme=settings.theme;
    document.querySelector('meta[name=theme-color]').setAttribute('content',settings.theme==='escuro'?'#1b1736':'#fde3c8');
    if(G&&G.P)recolor()}

  // ================= views =================
  function show(id){document.querySelectorAll('.view').forEach(v=>{if(v.id===id){v.classList.remove('left');v.classList.add('show')}else if(v.classList.contains('show')){v.classList.remove('show');v.classList.add('left')}})}
  function openSheet(id){$(id).classList.add('show')}
  function closeSheets(){document.querySelectorAll('.sheetWrap').forEach(s=>s.classList.remove('show'))}
  document.querySelectorAll('.sheetWrap').forEach(w=>{w.addEventListener('click',e=>{if(e.target===w||e.target.hasAttribute('data-close'))closeSheets()})});

  function renderHome(){
    $('hPlaySub').textContent=`Fase ${progress.normal} · ${MODES.normal.size(progress.normal)}×${MODES.normal.size(progress.normal)}`;
    $('hHardSub').textContent=`Fase ${progress.hard} · ${MODES.hard.size(progress.hard)}×${MODES.hard.size(progress.hard)}`;
    const done=stats.lastDaily===today(),alive=stats.lastDaily===today()||stats.lastDaily===yesterday(),st=alive?stats.streak:0;
    $('hDailySub').innerHTML=(done?'Concluído hoje ✓':'Um tabuleiro novo por dia')+(st?` · <span class="flame">🔥</span> ${st} dia${st>1?'s':''}`:'');
  }

  // ================= game =================
  let G=null; // current game
  const games={};
  const boardEl=$('board');
  let timerId=null;

  function startMode(mode){
    const key=mode==='daily'?'daily-'+today():mode+'-'+(progress[mode]||1);
    show('game');
    if(games[mode]&&games[mode].key===key&&!games[mode].over){G=games[mode];build(false);draw(true);updateHeader();startTimer();return}
    const lvl=mode==='daily'?1:progress[mode];
    const M=MODES[mode],n=M.size(lvl);
    G={mode,key,lvl,n,k:M.k,P:null,state:null,hearts:3,found:0,hints:1,seconds:0,over:false};games[mode]=G;
    updateHeader();
    boardEl.style.gridTemplateColumns='';boardEl.innerHTML=`<div class="loading"><svg class="bru"><use href="#b-neutral" width="100%" height="100%"/></svg>Escondendo os Brunos…</div>`;
    setTimeout(()=>{
      const seed=mode==='daily'?Number(today().replace(/-/g,'')):null;
      G.P=generate(n,M.k,{seed,candidates:M.cands(lvl),budgetMs:650});
      newBoard();
    },320);
  }
  function newBoard(){
    const N=G.n*G.n;G.state=new Array(N).fill(0);G.hearts=3;G.found=0;G.hints=1;G.seconds=0;G.over=false;
    G.solSet=new Set();G.P.sol.forEach((cols,r)=>cols.forEach(c=>G.solSet.add(r*G.n+c)));
    stats.played++;save();
    build(true);draw(true);updateHeader();startTimer();
    sfx('pop','inicio');
  }
  function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(G&&!G.over&&$('game').classList.contains('show')){G.seconds++;drawTimer()}},1000)}
  function updateHeader(){
    const M=MODES[G.mode];$('gTitle').innerHTML=M.label(G.lvl)+`<small>${G.n}×${G.n}${G.k>1?' · 2 Brunos':''}</small>`;
    $('rules').innerHTML=G.k===1?'<div>1 Bruno<br>por cor</div><div>1 por linha<br>e coluna</div><div>Brunos não<br>se encostam</div>'
      :'<div>2 Brunos<br>por cor</div><div>2 por linha<br>e coluna</div><div>Brunos não<br>se encostam</div>';
    $('statusBar').classList.toggle('zen',settings.zen);
    const hs=$('hearts').children;for(let i=0;i<3;i++){hs[i].classList.toggle('lost',i>=G.hearts);hs[i].classList.remove('breaking')}
    $('count').textContent=`${G.found}/${G.n*G.k}`;$('hintTxt').textContent=`Dica (${G.hints})`;$('bHint').disabled=G.hints<=0;
    setAvatar('neutral');drawTimer();
  }
  function build(animate){const n=G.n,pal=PALETTE[settings.theme];boardEl.innerHTML='';
    boardEl.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;boardEl.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;
    for(let i=0;i<n*n;i++){const r=(i/n)|0,c=i%n,g=G.P.reg[i],d=document.createElement('div');
      d.className='cell'+(animate?' enter':'');d.dataset.i=i;d.style.backgroundColor=pal[g%pal.length];d.style.setProperty('--in',((r+c)*28)+'ms');
      if(r>0&&G.P.reg[i-n]!==g)d.classList.add('bt');if(r<n-1&&G.P.reg[i+n]!==g)d.classList.add('bb');
      if(c>0&&G.P.reg[i-1]!==g)d.classList.add('bl');if(c<n-1&&G.P.reg[i+1]!==g)d.classList.add('br');
      d.addEventListener('animationend',e=>{if(e.animationName==='cellIn')d.classList.remove('enter')});
      boardEl.appendChild(d)}}
  function recolor(){const pal=PALETTE[settings.theme],kids=boardEl.children;for(let i=0;i<kids.length;i++){if(!kids[i].dataset.i)continue;
    const r=(i/G.n)|0,c=i%G.n;kids[i].style.transitionDelay=((r+c)*22)+'ms';kids[i].style.backgroundColor=pal[G.P.reg[i]%pal.length]}
    setTimeout(()=>{for(const el of kids)el.style.transitionDelay=''},900);draw(true,null,true)}
  const xSvg=(c,w,cls)=>`<svg viewBox="0 0 10 10" class="x ${cls||''}"><path d="M2 2L8 8" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><path d="M8 2L2 8" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/></svg>`;
  const bruHTML=(expr,stat)=>`<div class="bw ${stat?'static':''}" style="--o:${(-Math.random()*3.6).toFixed(2)}s"><svg class="bru"><use href="#b-${expr}" width="100%" height="100%"/></svg></div>`;
  const dist=(a,b)=>Math.max(Math.abs(((a/G.n)|0)-((b/G.n)|0)),Math.abs(a%G.n-b%G.n));
  function draw(stat,origin,force){const kids=boardEl.children,xc=getComputedStyle(document.body).getPropertyValue('--x').trim()||'#4a3328';
    for(let i=0;i<kids.length;i++){const el=kids[i];if(!el.dataset.i)continue;const s=G.state[i];
      el.classList.toggle('wrong',s===3);el.classList.toggle('auto',s===4);
      const want=s===2?'b':s===3?'r':(s===1||s===4)?'x':'';
      if(el.dataset.v===want&&!(force&&(want==='x')))continue;
      const prev=el.dataset.v||'';el.dataset.v=want;
      if(s===2){if(prev!=='b')el.innerHTML=bruHTML(stat?'neutral':'happy',stat)}
      else if(s===3)el.innerHTML=xSvg('#e5484d',1.9,stat?'static':'');
      else if(s===1||s===4){let cls=stat||prev==='x'?'static':'';if(!cls&&origin!=null&&s===4)cls='delay';
        el.innerHTML=xSvg(xc,1.6,cls);if(cls==='delay')el.firstChild.style.setProperty('--d',(dist(i,origin)*45+120)+'ms')}
      else{const x=el.querySelector('.x');if(x&&!stat){x.classList.add('out');setTimeout(()=>{if(G.state[i]===0)el.innerHTML=''},200)}else el.innerHTML=''}}
    const cnt=$('count'),txt=`${G.found}/${G.n*G.k}`;if(cnt.textContent!==txt){cnt.textContent=txt;if(!stat)restart(cnt,'bump')}}
  function drawTimer(){$('timer').textContent=fmt(G?G.seconds:0)}
  let avTimer=null;
  function setAvatar(expr,ms,anim){const u=$('avatar').querySelector('use');u.setAttribute('href','#b-'+expr);if(anim)restart($('avatar'),anim);
    clearTimeout(avTimer);if(ms)avTimer=setTimeout(()=>u.setAttribute('href','#b-neutral'),ms)}
  function cellExpr(i,expr,ms){const u=boardEl.children[i]&&boardEl.children[i].querySelector('use');if(!u)return;u.setAttribute('href','#b-'+expr);
    if(ms)setTimeout(()=>{if(G&&G.state[i]===2&&!G.over)u.setAttribute('href','#b-neutral')},ms)}

  // auto-✕ for k Brunos: mark cells that can no longer hold a Bruno
  function autoMark(i){if(!settings.auto)return;const n=G.n,k=G.k,st=G.state;
    const rowC=new Array(n).fill(0),colC=new Array(n).fill(0),regC=new Array(n).fill(0);
    for(let j=0;j<n*n;j++)if(st[j]===2){rowC[(j/n)|0]++;colC[j%n]++;regC[G.P.reg[j]]++}
    for(let j=0;j<n*n;j++){if(st[j]!==0)continue;const r=(j/n)|0,c=j%n;
      let block=rowC[r]>=k||colC[c]>=k||regC[G.P.reg[j]]>=k;
      if(!block)for(let dr=-1;dr<=1&&!block;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if((dr||dc)&&rr>=0&&cc>=0&&rr<n&&cc<n&&st[rr*n+cc]===2){block=true;break}}
      if(block)st[j]=4}}
  function celebrate(i){const el=boardEl.children[i],rp=document.createElement('div');rp.className='ripple';el.appendChild(rp);setTimeout(()=>rp.remove(),800);
    const g=G.P.reg[i];for(let j=0;j<G.n*G.n;j++)if(G.P.reg[j]===g){const c=boardEl.children[j];c.style.setProperty('--d',(dist(i,j)*55)+'ms');restart(c,'flash')}}
  function place(i){
    if(G.solSet.has(i)){G.state[i]=2;G.found++;stats.brunos++;autoMark(i);draw(false,i);celebrate(i);cellExpr(i,'happy',1300);setAvatar('happy',1200,'react');
      sfx('good','acerto');vibe(12);if(G.found===G.n*G.k)win()}
    else{G.state[i]=3;G.hearts--;draw(false);restart(boardEl.children[i],'err');restart(boardEl.parentElement,'shake');
      const h=$('hearts').children[G.hearts];if(h){h.classList.add('lost');restart(h,'breaking')}
      setAvatar('scared',1600,'shiver');sfx('bad','erro');vibe([30,40,30]);if(G.hearts<=0)lose()}
  }

  // ================= input =================
  let drag=null;
  const press=el=>{el.classList.add('press');setTimeout(()=>el.classList.remove('press'),60)};
  boardEl.addEventListener('pointerdown',e=>{if(!G||G.over||!G.P)return;const el=e.target.closest('.cell');if(!el)return;ac();
    const i=+el.dataset.i,s=G.state[i];if(s===2||s===3)return;press(el);
    if(s===0){G.state[i]=1;drag={mode:'mark',start:i,moved:false};draw(false);sfx('mark')}else drag={mode:'place',start:i,moved:false};
    try{boardEl.setPointerCapture(e.pointerId)}catch(_){}});
  boardEl.addEventListener('pointermove',e=>{if(!drag)return;const el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest&&el.closest('.cell');if(!cell)return;
    const i=+cell.dataset.i;if(i===drag.start)return;drag.moved=true;
    if(drag.mode==='mark'&&G.state[i]===0){G.state[i]=1;press(cell);draw(false);sfx('tap')}
    if(drag.mode==='place')drag.mode='unmark';
    if(drag.mode==='unmark'&&(G.state[i]===1||G.state[i]===4)){G.state[i]=0;draw(false)}});
  boardEl.addEventListener('pointerup',()=>{if(!drag)return;if(drag.mode==='place'&&!drag.moved)place(drag.start);drag=null});
  boardEl.addEventListener('pointercancel',()=>{drag=null});

  $('bHint').onclick=()=>{if(!G||G.over||G.hints<=0)return;const cand=[...G.solSet].filter(i=>G.state[i]!==2);if(!cand.length)return;
    const i=cand[Math.floor(Math.random()*cand.length)];G.hints--;$('hintTxt').textContent=`Dica (${G.hints})`;$('bHint').disabled=true;
    G.state[i]=2;G.found++;autoMark(i);draw(false,i);celebrate(i);restart(boardEl.children[i],'hint');cellExpr(i,'happy',1300);sfx('hint','dica');
    if(G.found===G.n*G.k)win()};
  $('bClear').onclick=()=>{if(!G||G.over)return;G.state=G.state.map(s=>s===1||s===4?0:s);draw(false)};
  $('gBack').onclick=()=>{renderHome();show('home')};
  $('gSettings').onclick=()=>{renderSettings();openSheet('setWrap')};
  $('hPlay').onclick=()=>{ac();startMode('normal')};
  $('hHard').onclick=()=>{ac();startMode('hard')};
  $('hDaily').onclick=()=>{ac();startMode('daily')};
  $('hStats').onclick=()=>{renderStats();openSheet('statsWrap')};
  $('hSettings').onclick=()=>{renderSettings();openSheet('setWrap')};

  // ================= win / lose =================
  const fx=$('fx');
  function confetti(){const cols=PALETTE.claro;for(let k=0;k<54;k++){const d=document.createElement('div');d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';d.style.background=cols[k%cols.length];d.style.setProperty('--t',(2.2+Math.random()*1.6)+'s');
    d.style.setProperty('--dl',(Math.random()*.7)+'s');d.style.setProperty('--sx',((Math.random()-.5)*160)+'px');
    d.style.setProperty('--r',((Math.random()>.5?1:-1)*(360+Math.random()*360))+'deg');document.body.appendChild(d);setTimeout(()=>d.remove(),4800)}}
  function win(){
    G.over=true;stats.won++;const n=G.n,kids=boardEl.children;
    if(!settings.zen){const key=`${n}${G.k>1?'x2':''}`;if(!stats.best[key]||G.seconds<stats.best[key])stats.best[key]=G.seconds}
    let nextLabel='Próxima fase ▶';
    if(G.mode==='normal'){progress.normal++;nextLabel=`Fase ${progress.normal} ▶`}
    if(G.mode==='hard'){progress.hard++;stats.hardWon++;nextLabel=`Difícil ${progress.hard} ▶`}
    if(G.mode==='daily'){if(stats.lastDaily!==today()){stats.streak=stats.lastDaily===yesterday()?stats.streak+1:1;stats.bestStreak=Math.max(stats.bestStreak,stats.streak);stats.dailyDone++;stats.lastDaily=today()}nextLabel='Voltar ao menu'}
    save();
    setAvatar('cheer');
    setTimeout(()=>{for(let i=0;i<n*n;i++){const r=(i/n)|0,c=i%n;kids[i].style.setProperty('--d',((r+c)*40)+'ms');restart(kids[i],'wave')}},300);
    let idx=0;setTimeout(()=>{[...G.solSet].sort((a,b)=>a-b).forEach(i=>{const bw=kids[i].querySelector('.bw');if(!bw)return;
      bw.querySelector('use').setAttribute('href','#b-cheer');bw.style.setProperty('--c',(idx++*80)+'ms');restart(bw,'cheer')})},450);
    const wait=450+G.solSet.size*80+600;
    setTimeout(()=>{
      sfx('win');confetti();
      const stars=[0,1,2].map(k=>`<span style="animation-delay:${k*.14}s">${k<G.hearts?'⭐':'☆'}</span>`).join('');
      const sparks=[[-10,20],[220,30],[-20,180],[230,170],[100,-20],[110,235]].map((p,i)=>`<span class="spark" style="left:${p[0]}px;top:${p[1]}px;--sd:${i*.3}s">${i%2?'✨':'⭐'}</span>`).join('');
      fx.className='fx';fx.innerHTML=`<h1>${WIN_WORDS[Math.floor(Math.random()*WIN_WORDS.length)]}</h1>
        <div class="stage"><div class="rays"></div><div class="glow"></div>${sparks}<svg class="face bru"><use href="#b-cheer" width="100%" height="100%"/></svg></div>
        <div class="phrase" id="phrase">${PHRASE.split(' ').map(w=>`<span>${w}</span>`).join(' ')}</div>
        <div class="fxInfo" id="fxInfo"><div class="stars">${stars}</div>${settings.zen?'':`Tempo ${fmt(G.seconds)}`}${G.mode==='daily'?` · 🔥 ${stats.streak} dia${stats.streak>1?'s':''} seguidos`:''}</div>
        <div class="fxBtns" id="fxBtns"><button class="bigbtn" id="fxNext">${nextLabel}</button>${G.mode!=='daily'?'<button class="ghost" id="fxMenu">Menu</button>':''}</div>`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>fx.classList.add('show')));
      const words=fx.querySelectorAll('.phrase span');const step=AUD.vitoria&&settings.sound?Math.max(170,Math.round(((AUD.vitoria.duration||3.1)*1000-300)/words.length)):170;

  }

      fx.className='fx lose';fx.innerHTML=`<h1>Ops!</h1><div class="stage" style="height:200px"><svg class="face bru" style="width:160px;height:160px"><use href="#b-scared" width="100%" height="100%"/></svg></div>
        <div class="phrase" style="min-height:0">Acabaram as vidas</div>
        <div class="fxBtns in"><button class="bigbtn" id="fxRetry">Tentar de novo</button><button class="ghost" id="fxNew">${G.mode==='daily'?'Menu':'Outro tabuleiro'}</button></div>`;

    },700);
  }

  // ================= stats & settings =================
  function renderStats(){
    const alive=stats.lastDaily===today()||stats.lastDaily===yesterday();
    const rate=stats.played?Math.round(stats.won/stats.played*100):0;
    const rows=[5,6,7,8,9,10].map(n=>`<tr><td>${n}×${n}</td><td>${stats.best[n]?fmt(stats.best[n]):'—'}</td></tr>`).join('')+
      [8,9,10].map(n=>`<tr><td>${n}×${n} · 2 Brunos</td><td>${stats.best[n+'x2']?fmt(stats.best[n+'x2']):'—'}</td></tr>`).join('');
    $('statsBody').innerHTML=`<div class="statGrid">
      <div class="statBox"><b>${progress.normal-1}</b><small>fases concluídas</small></div>

      <div class="statBox"><b>${stats.bestStreak}</b><small>melhor sequência</small></div>
      <div class="statBox"><b>${rate}%</b><small>vitórias</small></div>
      <div class="statBox"><b>${stats.brunos}</b><small>Brunos encontrados</small></div></div>
      <div class="sec">Melhores tempos</div><table class="tbl">${rows}</table>`;
  }
  function renderSettings(){
    const sw=(k,t,d)=>`<div class="setRow"><div><b>${t}</b><small>${d}</small></div><button class="switch ${settings[k]?'on':''}" data-k="${k}" aria-label="${t}"></button></div>`;
    $('setBody').innerHTML=`<div class="setRow"><div><b>Tema</b><small>Visual do jogo</small></div><div class="seg"><button data-t="claro" class="${settings.theme==='claro'?'on':''}">☀️ Claro</button><button data-t="escuro" class="${settings.theme==='escuro'?'on':''}">🌙 Escuro</button></div></div>
      ${sw('zen','Modo zen','Esconde o cronômetro')}
      ${sw('auto','Auto ✕','Marca ✕ sozinho onde não cabe mais Bruno')}
      ${sw('sound','Sons','Efeitos e a voz do Bruno')}
      ${sw('vibe','Vibração','Vibra ao acertar e errar')}
      <button class="danger" id="resetBtn">Zerar progresso</button>`;
    $('setBody').querySelectorAll('.switch').forEach(b=>b.onclick=()=>{const k=b.dataset.k;settings[k]=!settings[k];b.classList.toggle('on',settings[k]);save();
      if(k==='zen'&&G)$('statusBar').classList.toggle('zen',settings.zen);if(k==='sound'&&settings.sound)sfx('pop')});
    $('setBody').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{settings.theme=b.dataset.t;save();applyTheme();renderSettings()});
    const rb=$('resetBtn');rb.onclick=()=>{if(rb.dataset.c){progress={normal:1,hard:1};stats={played:0,won:0,lost:0,best:{},hardWon:0,dailyDone:0,streak:0,bestStreak:0,lastDaily:null,brunos:0};
      for(const k in games)games[k]=null;save();renderHome();rb.textContent='Progresso zerado ✓';rb.disabled=true}else{rb.dataset.c=1;rb.textContent='Toque de novo para confirmar'}};
  }

  applyTheme();renderHome();
  window.__bru={get G(){return G}};
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
